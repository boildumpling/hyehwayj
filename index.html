<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>스네이크 게임</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: #121212;
    color: #eee;
    font-family: 'Segoe UI', sans-serif;
    height: 100%;
    overflow: hidden;
    touch-action: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: env(safe-area-inset-top, 12px);
  }
  #score {
    font-size: 7vw;
    margin: 10px 0 8px;
    font-weight: bold;
    color: #4caf50;
  }
  #gameWrap {
    width: 92vw;
    max-width: 420px;
    aspect-ratio: 1 / 1;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: #1a1a1a;
    border: 2px solid #333;
    box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
    border-radius: 8px;
  }
  #message {
    margin-top: 10px;
    font-size: 4vw;
    color: #aaa;
    min-height: 18px;
    text-align: center;
  }
  #restartBtn {
    margin-top: 8px;
    padding: 10px 26px;
    background: #4caf50;
    color: #121212;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    display: none;
  }
  #controls {
    margin-top: 16px;
    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 60px 60px 60px;
    gap: 6px;
  }
  #controls button {
    background: #1e1e1e;
    border: 2px solid #4caf50;
    color: #4caf50;
    font-size: 24px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  #controls button:active {
    background: #4caf50;
    color: #121212;
  }
  #btnUp { grid-column: 2; grid-row: 1; }
  #btnLeft { grid-column: 1; grid-row: 2; }
  #btnRight { grid-column: 3; grid-row: 2; }
  #btnDown { grid-column: 2; grid-row: 3; }
</style>
</head>
<body>
  <div id="score">점수: 0</div>
  <div id="gameWrap">
    <canvas id="game" width="400" height="400"></canvas>
  </div>
  <div id="message">화면을 스와이프하거나 아래 버튼으로 조작하세요</div>
  <button id="restartBtn">다시 시작</button>

  <div id="controls">
    <button id="btnUp">▲</button>
    <button id="btnLeft">◀</button>
    <button id="btnRight">▶</button>
    <button id="btnDown">▼</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const messageEl = document.getElementById('message');
const restartBtn = document.getElementById('restartBtn');

const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake, direction, nextDirection, apple, score, gameOver, gameLoopId;

function init() {
  snake = [{x: 10, y: 10}];
  direction = {x: 0, y: 0};
  nextDirection = {x: 0, y: 0};
  score = 0;
  gameOver = false;
  scoreEl.textContent = '점수: 0';
  messageEl.textContent = '화면을 스와이프하거나 아래 버튼으로 조작하세요';
  restartBtn.style.display = 'none';
  placeApple();
  if (gameLoopId) clearInterval(gameLoopId);
  gameLoopId = setInterval(gameLoop, 200);
}

function placeApple() {
  let valid = false;
  while (!valid) {
    apple = {
      x: Math.floor(Math.random() * tileCount),
      y: Math.floor(Math.random() * tileCount)
    };
    valid = !snake.some(s => s.x === apple.x && s.y === apple.y);
  }
}

function gameLoop() {
  if (gameOver) return;

  direction = nextDirection;
  if (direction.x === 0 && direction.y === 0) {
    draw();
    return;
  }

  const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
    endGame();
    return;
  }

  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame();
    return;
  }

  snake.unshift(head);

  // 사과를 먹으면 꼬리를 자르지 않아 몸이 한 칸 길어짐
  if (head.x === apple.x && head.y === apple.y) {
    score++;
    scoreEl.textContent = '점수: ' + score;
    placeApple();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#e53935';
  ctx.beginPath();
  ctx.arc(apple.x * gridSize + gridSize/2, apple.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
  ctx.fill();

  snake.forEach((segment, i) => {
    ctx.fillStyle = i === 0 ? '#66bb6a' : '#4caf50';
    ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
  });
}

function endGame() {
  gameOver = true;
  clearInterval(gameLoopId);
  messageEl.textContent = '게임 오버! 최종 점수: ' + score;
  restartBtn.style.display = 'inline-block';
}

function setDir(x, y) {
  if (x !== 0 && direction.x === 0) nextDirection = {x, y: 0};
  if (y !== 0 && direction.y === 0) nextDirection = {x: 0, y};
}

// 키보드 (PC 테스트용)
document.addEventListener('keydown', (e) => {
  switch(e.key) {
    case 'ArrowUp': setDir(0, -1); break;
    case 'ArrowDown': setDir(0, 1); break;
    case 'ArrowLeft': setDir(-1, 0); break;
    case 'ArrowRight': setDir(1, 0); break;
  }
});

// 화면 버튼
document.getElementById('btnUp').addEventListener('click', () => setDir(0, -1));
document.getElementById('btnDown').addEventListener('click', () => setDir(0, 1));
document.getElementById('btnLeft').addEventListener('click', () => setDir(-1, 0));
document.getElementById('btnRight').addEventListener('click', () => setDir(1, 0));

// 스와이프 제스처
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive: true});

document.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    setDir(dx > 0 ? 1 : -1, 0);
  } else {
    setDir(0, dy > 0 ? 1 : -1);
  }
}, {passive: true});

restartBtn.addEventListener('click', init);

init();
</script>
</body>
</html>
